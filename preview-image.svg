  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- 主标题 -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
